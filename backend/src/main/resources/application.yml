spring:
  application:
    name: backend
  datasource:
    # ${DB_HOST:localhost}: DB_HOST 환경변수가 있으면 그 값을, 없으면 localhost를 씁니다.
    # 로컬에서 ./gradlew bootRun으로 직접 실행할 때는 DB_HOST를 안 넘기므로 지금까지처럼
    # localhost(호스트에 노출된 5432 포트)로 접속합니다. Docker Compose로 배포할 때는
    # backend 컨테이너의 environment에 DB_HOST=db를 넣어서, 같은 Docker 네트워크 안의
    # db 서비스 이름으로 접속하도록 바꿉니다(컨테이너 안에서 localhost는 배포 시 반드시
    # 고쳐야 하는 부분이었습니다 — infra/README.md, docs/troubleshooting.md 참고).
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/news_briefing
    username: appuser
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # Flyway: DB 스키마 변경 이력을 backend/src/main/resources/db/migration의 SQL
  # 파일들로 관리하고, 앱이 뜰 때마다 자동으로 적용해줍니다(별도 명령 불필요). 예전에는
  # 여기 spring.sql.init.mode: always로 schema.sql을 매번 실행했는데, 그 방식은 "스키마를
  # 어떻게 바꿨는지"를 기록하지 않고 "지금 최종 모습"만 남겨서, 실제 변경은 로컬/EC2 DB에
  # 각각 사람이 직접 ALTER TABLE을 실행해야 했습니다 — 이 과정에서 한쪽에 적용을 깜빡해
  # 배치가 500 에러로 죽는 사고가 실제로 있었습니다(docs/troubleshooting.md 21번 항목).
  flyway:
    # baseline-on-migrate: 로컬/EC2 DB 둘 다 이미 데이터가 있고 Flyway 도입 전
    # schema.sql 기준 최종 상태까지 반영된 상태입니다. Flyway가 관리 이력 테이블
    # (flyway_schema_history)이 없는 걸 보고 "빈 DB"로 오해해서 V1을 처음부터 다시
    # 실행하려고 하면 이미 있는 테이블과 충돌해서 에러가 납니다. 이 옵션을 켜두면,
    # 관리 이력이 없는데 테이블은 이미 있는 상태를 만나면 V1을 실제로 실행하지 않고
    # "이미 적용된 것으로 표시"만 하고 넘어갑니다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "schema.sql 최종 상태(reason 컬럼 포함) baseline"

rss:
  sources:
    - name: 전자신문
      url: https://rss.etnews.com/Section901.xml
    - name: 연합뉴스
      url: https://www.yna.co.kr/rss/economy.xml

collector:
  retry:
    max-attempts: 3
    backoff-seconds: [2, 4, 8]
  schedule:
    fixed-delay-ms: 1800000 # 30분

crawler:
  selectors:
    - name: 전자신문
      selector: "#articleBody"
    - name: 연합뉴스
      selector: "div.story-news.article"

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com/v1
  model: gpt-4o-mini
  max-input-chars: 1500 # OpenAI에 넘기는 뉴스 원문 길이 제한 (비용 관리)
  batch-size: 20 # 한 번 실행(스케줄 또는 수동 트리거)당 최대 처리 건수
  retry:
    max-attempts: 3
    backoff-seconds: [2, 4, 8]
  schedule:
    # 매시간 정각. 예전엔 하루 3회(08/13/18시)였는데, 실측 결과 실제 뉴스 수집량이
    # 하루 평균 120건인데 처리 용량은 하루 60건(3회 x 20건)뿐이라 매일 약 60건씩
    # 백로그가 순증했다(docs/troubleshooting.md 참고). 매시간(24회 x 20건 = 480건/일)으로
    # 늘려 실제 수집량 대비 4배 여유를 두면, 밀린 게 없을 땐 배치가 0건을 확인하고
    # 바로 끝나므로(처리한 만큼만 OpenAI를 호출) 비용 증가 없이 지연만 해소된다.
    cron: "0 0 * * * *"

ai:
  industries: [금융, 제조, 반도체, "플랫폼/IT서비스", "유통/커머스", 에너지, "바이오/헬스케어", "공공/정부"]
  jobs: [IT전산, 데이터분석, 백엔드]
  structuring:
    max-age-days: 2 # 수집된 지 이보다 오래된 뉴스는 AI 구조화 대상에서 제외(news_filtered_out에 TOO_OLD로 기록)
  filter:
    # 제목에 아래 키워드가 하나라도 포함되면 AI 구조화 대상에서 제외한다 (LLM 호출 없이 판단).
    exclude-title-keywords:
      - 코스피
      - 코스닥
      - 환율
      - 외국환시세
      - "[인사]"
      - "[부고]"
      - 금리
      - 국고채
      - 유가
      - 국제유가
      - 마감시황
      - 개장시황
      - "[동정]"
      - "[포토]"
      - "[화보]"
      - 로또
    min-content-length: 200 # 크롤링한 원문(메모리)이 이보다 짧으면 제외

briefing:
  top-n: 10 # 조회 시 하루 상위 몇 건까지 보여줄지

daily-highlight:
  min-news-count: 3 # 재료 건수(briefing.top-n 이내)가 이보다 적으면 LLM을 호출하지 않음(억지 연결 방지)
