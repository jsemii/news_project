services:
  db:
    image: postgres:16-alpine
    container_name: news-briefing-db
    environment:
      POSTGRES_DB: news_briefing
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # command: postgres 공식 이미지는 TZ 환경변수를 자동으로 읽어서 시간대를 바꿔주지
    # 않습니다(직접 확인함 — TZ만 넣었더니 SHOW timezone이 여전히 UTC였음). "-c
    # timezone=Asia/Seoul"로 Postgres 실행 옵션 자체에 시간대를 명시해야 실제로
    # 적용됩니다. collected_at/analyzed_at/filtered_at 같은 TIMESTAMP 컬럼은 자바
    # 코드가 아니라 Postgres 자신이 now()로 채우는데(schema.sql의 DEFAULT now()),
    # 이 설정이 없으면 UTC로 시각을 찍어서 자정~오전 9시(한국시간) 사이에 일어난 일들이
    # "하루 전" 날짜로 저장돼버립니다(예: 한국시간 8/23 02:00에 분석된 뉴스가
    # analyzed_at::date로는 8/22로 찍힘). backend 컨테이너의 시간대(Dockerfile의
    # TZ=Asia/Seoul)와 반드시 맞춰줘야 날짜 비교가 정확합니다.
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    # 호스트에 포트를 노출하지 않습니다 — backend가 같은 Docker 네트워크 안에서 "db"라는
    # 서비스 이름으로 5432에 접속하는 데는 ports 매핑이 필요 없습니다(컨테이너 간 통신은
    # 컴포즈가 만든 내부 네트워크로 항상 가능). 외부에서 DB에 직접 접속할 이유가 없으므로,
    # backend/db는 nginx를 통해서만 외부에 노출한다는 배포 원칙에 맞춰 막아둡니다.
    volumes:
      - news-briefing-db-data:/var/lib/postgresql/data
    # healthcheck: "컨테이너 프로세스가 시작됐다"와 "Postgres가 접속을 받을 준비가 됐다"는
    # 다른 얘기입니다(초기화에 몇 초 걸림). pg_isready로 진짜 접속 가능한 상태인지 주기적으로
    # 확인해서, backend가 이 상태를 기다렸다가(depends_on 참고) 뜨도록 합니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d news_briefing"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: news-briefing-backend
    environment:
      # DB_HOST=db: Docker 내부 네트워크에서 db 서비스는 "db"라는 이름으로 접속합니다
      # (localhost가 아님 — application.yml의 ${DB_HOST:localhost} 참고).
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    # condition: service_healthy: db 컨테이너가 그냥 "떠있기만" 한 게 아니라 위 healthcheck를
    # 통과할 때까지 기다린 뒤에 backend를 시작합니다. 이게 없으면 Postgres가 아직 접속을 못
    # 받는 상태에서 backend가 먼저 접속을 시도하다가 실패하고 죽을 수 있습니다.
    depends_on:
      db:
        condition: service_healthy
    # 별도 actuator 의존성을 추가하지 않고, 이미 있는 GET /api/briefings를 헬스체크로
    # 재사용합니다(200이 오면 "DB 연결까지 포함해서 정상"이라는 뜻).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/briefings"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 호스트에 포트를 노출하지 않습니다 — 외부에서 직접 접근할 이유가 없고, nginx만
    # Docker 내부 네트워크로 backend:8080에 접근하면 충분합니다(공격 표면 최소화).

  nginx:
    build:
      # 레포 루트를 빌드 컨텍스트로 씁니다 — frontend/Dockerfile이 frontend/ 밖에 있는
      # infra/nginx/default.conf도 COPY해야 하기 때문입니다.
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: news-briefing-nginx
    ports:
      - "80:80"
      - "443:443"
    # certbot-etc: Let's Encrypt 인증서 파일(/etc/letsencrypt) 공유. certbot-www:
    # 도메인 소유권 확인(HTTP-01 challenge) 파일을 nginx가 그대로 서빙해야 해서 공유.
    # nginx는 둘 다 읽기만 하면 되므로 :ro(read-only)로 마운트합니다 — 쓰기는 certbot
    # 컨테이너만 합니다.
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  # certbot: Let's Encrypt 인증서를 발급/갱신하는 전용 컨테이너입니다. nginx처럼 상시
  # 떠있는 서비스가 아니라 "docker compose --profile certbot run --rm certbot ..."로
  # 필요할 때만 실행하고 바로 끝나는 1회성 명령입니다. profiles로 기본 프로필에서
  # 뺀 이유: profiles가 없으면 매 배포(`docker compose up --build -d`)마다 이 컨테이너도
  # 같이 띄우려다가 즉시 종료돼(certbot은 인자 없이 실행하면 도움말만 찍고 끝남)
  # `docker compose ps`에 "Exited"로 나타나서, infra/scripts/deploy.sh의 실패 감지
  # (unhealthy|exit 문자열 검사)가 정상 배포를 실패로 잘못 판단하게 됩니다.
  certbot:
    image: certbot/certbot
    container_name: news-briefing-certbot
    profiles: ["certbot"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  news-briefing-db-data:
  certbot-etc:
  certbot-www:
