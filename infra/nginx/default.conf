# [전체 흐름에서의 위치] nginx 컨테이너(frontend/Dockerfile의 런타임 스테이지)가 쓰는 설정
# 파일입니다. 이 컨테이너 하나가 두 가지 역할을 동시에 합니다: (1) React 빌드 결과물(정적
# 파일)을 직접 서빙하고, (2) "/api"로 시작하는 요청은 backend 컨테이너로 그대로 전달(리버스
# 프록시)합니다. 브라우저 입장에서는 프론트/백엔드가 같은 주소(같은 origin)에서 오는 것처럼
# 보이므로, 프론트 코드가 fetch('/api/...')처럼 상대 경로만 쓰면 되고 CORS 설정도 필요 없습니다
# (로컬 개발에서 vite.config.js의 proxy가 하던 역할을, 배포 환경에서는 이 nginx가 대신합니다).
#
# [HTTPS 적용 2단계 — 최종] 80번(HTTP) 서버 블록은 이제 실제 콘텐츠를 서빙하지 않고,
# 전부 443(HTTPS)으로 리다이렉트합니다. 단, /.well-known/acme-challenge/는 80번에
# 그대로 남겨둡니다 — Let's Encrypt 갱신(certbot renew)이 계속 HTTP-01 방식(80번 포트로
# 도메인 소유권 확인)을 쓰기 때문에, 이 경로까지 443으로 리다이렉트해버리면 갱신이 깨집니다.
server {
    listen 80;
    server_name newsbriefing.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name newsbriefing.duckdns.org;

    # certbot이 발급한 인증서 경로입니다(docker-compose.yml의 certbot-etc 볼륨을 통해
    # nginx 컨테이너의 /etc/letsencrypt에 마운트되어 있습니다). certbot renew가 파일을
    # 갱신해도 경로 자체는 그대로라 nginx 설정을 다시 바꿀 필요는 없고, `nginx -s reload`로
    # 새 인증서를 무중단으로 반영하기만 하면 됩니다.
    ssl_certificate /etc/letsencrypt/live/newsbriefing.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsbriefing.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # backend 컨테이너로 보내는 리버스 프록시. "backend"는 docker-compose.yml에 정의된
    # 서비스 이름이고, Docker Compose가 자체 DNS로 이 이름을 backend 컨테이너의 IP로
    # 풀어줍니다(localhost가 아님 — 컨테이너는 서로 다른 네트워크 네임스페이스에 있습니다).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx의 기본 프록시 타임아웃은 60초인데, POST /api/structuring/run(수동 AI
        # 구조화 트리거)은 배치 크기(기본 20건) x 2회(1단계 요약 + 2단계 직무별 재해석)
        # OpenAI 호출을 순서대로 처리하느라 60초를 넘기기 쉽다. 실제로 EC2에서 60초 만에
        # 504 Gateway Timeout이 나는 것을 겪었다(docs/troubleshooting.md 참고) — 이때
        # 백엔드 자체가 죽은 게 아니라, nginx가 응답을 기다리다 먼저 포기하고 클라이언트에게
        # 에러를 돌려준 것뿐이었다. 넉넉하게 5분(300초)까지 기다리도록 늘린다.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # GitHub/Google OAuth2 로그인 경로입니다. Spring Security의 기본 경로 규칙상
    # 로그인 시작(/oauth2/authorization/{provider})과 콜백(/login/oauth2/code/{provider})이
    # "/api/" 밖에 있어서, 위 location /api/만으로는 backend에 도달하지 못하고 SPA
    # 정적 파일(index.html)이 대신 응답해버립니다(로그인이 전혀 동작하지 않는 원인이
    # 됨 — infra/README.md 참고). /.well-known/acme-challenge/ 때와 같은 이유로
    # location을 추가합니다. 리다이렉트 왕복이라 오래 안 걸리므로 별도 타임아웃 설정은
    # 필요 없습니다.
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 파일 서빙. try_files는 요청 경로에 실제 파일이 있으면 그 파일을(예: /assets/xxx.js),
    # 없으면 index.html을 대신 돌려줍니다 — React 같은 SPA(단일 페이지 앱)에서 브라우저 주소창에
    # 직접 어떤 경로를 쳐도(예: /briefings) 항상 index.html이 뜨고 그 안에서 자바스크립트가
    # 화면을 그리도록 하기 위한 표준적인 설정입니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
