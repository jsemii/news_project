plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jobnews'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
	implementation 'com.rometools:rome:2.1.0'
	implementation 'org.springframework:spring-webflux'
	implementation 'io.projectreactor.netty:reactor-netty'
	implementation 'org.jsoup:jsoup:1.21.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	// Flyway: DB 스키마 변경 이력을 코드(마이그레이션 파일)로 관리하고 앱 기동 시 자동
	// 적용해주는 라이브러리입니다. Spring Boot 4.x부터는 flyway-core만으로는 부족하고,
	// 이 스타터(자동 설정 담당) + DB별 지원 아티팩트(flyway-database-postgresql)를 함께
	// 넣어야 합니다(docs/troubleshooting.md 참고 — 예전엔 flyway-core 하나면 됐는데
	// PostgreSQL 지원이 별도 아티팩트로 분리됨).
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// GitHub/Google OAuth2 로그인(Spring Security OAuth2 Client)에 필요합니다. 이
	// 스타터가 spring-boot-starter-security를 전이 의존성으로 함께 가져오므로, 그것과
	// 별도로 security starter를 추가하지 않습니다(./gradlew dependencies로 실제 확인함).
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// JJWT: 로그인 성공 시 우리 서버가 자체 발급하는 JWT(HttpOnly 쿠키에 담아 로그인
	// 상태 유지)를 만들고 검증하는 데 씁니다. jjwt-api는 컴파일 시점 의존성, jjwt-impl/
	// jjwt-jackson은 실제 서명·직렬화 구현체라 runtimeOnly로 충분합니다(공식 권장 구성).
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
