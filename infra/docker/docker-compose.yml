services:
  db:
    image: postgres:16-alpine
    container_name: news-briefing-db
    environment:
      POSTGRES_DB: news_briefing
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - news-briefing-db-data:/var/lib/postgresql/data

volumes:
  news-briefing-db-data:
