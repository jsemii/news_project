# [전체 흐름에서의 위치] nginx 컨테이너(frontend/Dockerfile의 런타임 스테이지)가 쓰는 설정
# 파일입니다. 이 컨테이너 하나가 두 가지 역할을 동시에 합니다: (1) React 빌드 결과물(정적
# 파일)을 직접 서빙하고, (2) "/api"로 시작하는 요청은 backend 컨테이너로 그대로 전달(리버스
# 프록시)합니다. 브라우저 입장에서는 프론트/백엔드가 같은 주소(같은 origin)에서 오는 것처럼
# 보이므로, 프론트 코드가 fetch('/api/...')처럼 상대 경로만 쓰면 되고 CORS 설정도 필요 없습니다
# (로컬 개발에서 vite.config.js의 proxy가 하던 역할을, 배포 환경에서는 이 nginx가 대신합니다).
server {
    listen 80;
    # server_name을 실제 도메인으로 지정합니다. 서버 블록이 이거 하나뿐이라, IP로
    # 직접 접속(http://3.37.221.184/)해도 Host 헤더가 안 맞아 거부되는 게 아니라
    # 그대로 이 블록이 기본으로 처리합니다(기존 접속 방식이 안 끊깁니다).
    server_name newsbriefing.duckdns.org;

    root /usr/share/nginx/html;
    index index.html;

    # [HTTPS 적용 1단계 — 부트스트랩] Let's Encrypt가 도메인 소유권을 확인할 때
    # (HTTP-01 challenge) 이 경로로 접속해서 특정 파일이 있는지 확인합니다. certbot이
    # /var/www/certbot(docker-compose.yml의 certbot-www 볼륨)에 그 파일을 떨어뜨리면,
    # nginx가 여기서 그대로 서빙해줘야 인증이 통과합니다. 인증서 발급 자체는 EC2에서
    # `docker compose --profile certbot run --rm certbot certonly --webroot ...`로
    # 별도 실행합니다(이 nginx 설정 파일은 그대로 두고, 이 위치로만 통신).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # backend 컨테이너로 보내는 리버스 프록시. "backend"는 docker-compose.yml에 정의된
    # 서비스 이름이고, Docker Compose가 자체 DNS로 이 이름을 backend 컨테이너의 IP로
    # 풀어줍니다(localhost가 아님 — 컨테이너는 서로 다른 네트워크 네임스페이스에 있습니다).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx의 기본 프록시 타임아웃은 60초인데, POST /api/structuring/run(수동 AI
        # 구조화 트리거)은 배치 크기(기본 20건) x 2회(1단계 요약 + 2단계 직무별 재해석)
        # OpenAI 호출을 순서대로 처리하느라 60초를 넘기기 쉽다. 실제로 EC2에서 60초 만에
        # 504 Gateway Timeout이 나는 것을 겪었다(docs/troubleshooting.md 참고) — 이때
        # 백엔드 자체가 죽은 게 아니라, nginx가 응답을 기다리다 먼저 포기하고 클라이언트에게
        # 에러를 돌려준 것뿐이었다. 넉넉하게 5분(300초)까지 기다리도록 늘린다.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 정적 파일 서빙. try_files는 요청 경로에 실제 파일이 있으면 그 파일을(예: /assets/xxx.js),
    # 없으면 index.html을 대신 돌려줍니다 — React 같은 SPA(단일 페이지 앱)에서 브라우저 주소창에
    # 직접 어떤 경로를 쳐도(예: /briefings) 항상 index.html이 뜨고 그 안에서 자바스크립트가
    # 화면을 그리도록 하기 위한 표준적인 설정입니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
